# Compilación y unitarias: el CI de un repositorio PÚBLICO.
#
# Existe desde el 2026-09-18 y revierte en parte la decisión del 2026-08-15 (`T2-10`, ROADMAP.md →
# *Decisiones cerradas*). Aquella decisión daba por asumido que «un PR externo no ejecuta nada hasta que el
# mantenedor lo corre en su máquina». Con el repositorio abierto, eso deja sin red justo al código que no
# escribió el mantenedor.
#
# Lo que NO cambia de aquella decisión, y este workflow respeta:
#   · Las pruebas de UI NO se ejecutan aquí: lanzan el .exe real elevado, y las que tocan una unidad
#     necesitan la USB de pruebas. Solo se COMPILAN. Viven fuera de FormatDiskPro.slnx a propósito, y por
#     eso un error de compilación en ellas no aparecía en ningún sitio (CONTEXT.md §4, la trampa del
#     2026-08-16).
#   · La puerta de publicación sigue siendo `release.ps1 -UiTests` desde una terminal elevada.
#
# Un segundo job (AUD-058) publica la app como lo hace el instalador y analiza los scripts en PowerShell
# 5.1: es lo que solo fallaba el día del corte. Tampoco sustituye a la puerta: no compila el instalador.
#   · La objeción de fondo era que «un check verde que solo cubre las unitarias afirma más de lo que
#     prueba». Por eso el nombre del workflow dice lo que cubre (es el texto de la insignia del README), y el
#     resumen de cada ejecución dice lo que NO se ejecutó y qué unitarias se omitieron, con su motivo.
#
# Windows y no ubuntu: la app es WinUI 3 (net10.0-windows10.0.19041.0).
# `pwsh` (PowerShell 7) y no `powershell` (5.1): el 5.1 lee un script sin BOM con la página de códigos ANSI
# (la trampa de CONTEXT.md §4) y el resumen lleva acentos.
# Las acciones van fijadas a un commit, con su versión al lado: una etiqueta se puede mover, un commit no.
# Las mantiene al día Dependabot (.github/dependabot.yml).

name: Compilación y unitarias

# Ninguna prueba lee un .md ni nada de docs/ (comprobado el 2026-09-18: leen XAML, fuentes C#, LICENSE y
# THIRD-PARTY-NOTICES.txt). Si alguna empieza a hacerlo, hay que quitar este filtro o su cambio no se
# probará. Y si algún día se exige este check para fusionar, un PR solo de documentación se quedaría
# esperándolo: habría que quitarlo también.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilación + unitarias (UI solo compilada)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar el SDK de .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore FormatDiskPro.slnx

      # -warnaserror: el proyecto compila a 0 advertencias y ese es el listón (CONTRIBUTING.md). Se excluyen
      # NU1901–NU1904 (vulnerabilidades publicadas de paquetes NuGet): aparecen y desaparecen por
      # publicaciones de terceros y tumbarían PRs que no tienen nada que ver.
      - name: Compilar (Release, sin advertencias)
        id: build
        run: dotnet build FormatDiskPro.slnx -c Release --no-restore -warnaserror -nowarn:NU1901,NU1902,NU1903,NU1904

      - name: Pruebas unitarias
        id: tests
        run: dotnet test FormatDiskPro.slnx -c Release --no-build --nologo --logger "trx;LogFileName=unitarias.trx" --results-directory artifacts/tests

      # También si fallan las unitarias: una sola ejecución dice todo lo que está roto.
      - name: Compilar las pruebas de UI (sin ejecutarlas)
        id: uibuild
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet build tests/FormatDiskPro.UiTests/FormatDiskPro.UiTests.csproj -c Release -warnaserror -nowarn:NU1901,NU1902,NU1903,NU1904

      - name: Resumen (qué se ha comprobado y qué no)
        if: ${{ always() }}
        env:
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          UI_BUILD: ${{ steps.uibuild.outcome }}
        run: |
          function Icon([string]$outcome) {
            switch ($outcome) { 'success' { '✅' } 'failure' { '❌' } 'cancelled' { '⏹️ cancelado' } default { '⏭️ no se llegó a ejecutar' } }
          }

          $unit = Icon $env:TESTS
          $detail = @()
          $trx = Get-ChildItem -Path artifacts/tests -Filter *.trx -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            # XmlDocument.Load, como release.ps1 (T2-12): no depende de la codificación con la que se abra.
            $xml = [System.Xml.XmlDocument]::new()
            $xml.Load($trx.FullName)
            $results = @($xml.TestRun.Results.UnitTestResult)
            $passed  = @($results | Where-Object outcome -eq 'Passed').Count
            $failed  = @($results | Where-Object outcome -eq 'Failed')
            $skipped = @($results | Where-Object outcome -eq 'NotExecuted')
            $unit = "$unit $passed de $($results.Count) pasan · $($failed.Count) " +
                    $(if ($failed.Count -eq 1) { 'falla' } else { 'fallan' }) + " · $($skipped.Count) " +
                    $(if ($skipped.Count -eq 1) { 'omitida' } else { 'omitidas' })
            if ($failed.Count -gt 0) {
              $detail += @('', '**Unitarias que fallan** (el detalle está en el artefacto `resultados-unitarias`):', '')
              $detail += @($failed | Select-Object -First 20 | ForEach-Object { "- ``$($_.testName)``" })
            }
            if ($skipped.Count -gt 0) {
              $detail += @('', '**Unitarias omitidas, y por qué:**', '')
              $detail += @($skipped | ForEach-Object {
                $reason = $_.Output.ErrorInfo.Message
                $reason = if ($reason) { ($reason -replace '\s+', ' ').Trim() } else { 'sin motivo declarado' }
                "- ``$($_.testName)``: $reason"
              })
            }
          }

          $context = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/CONTEXT.md"
          $md = @(
            '## Qué comprueba este check, y qué no'
            ''
            '| Paso | Resultado |'
            '|---|---|'
            "| Compilación Release de la app y de las unitarias, **sin advertencias** | $(Icon $env:BUILD) |"
            "| Pruebas unitarias | $unit |"
            "| Pruebas de UI: **compilación** | $(Icon $env:UI_BUILD) |"
            '| Pruebas de UI: **ejecución** | ⚠️ **No se ejecutan aquí**: lanzan el `.exe` real elevado, y las que tocan una unidad necesitan la USB de pruebas |'
            ''
            "> Este check **no sustituye** a la puerta de publicación, que sigue siendo ``release.ps1 -UiTests`` desde una terminal elevada ([CONTEXT.md §4]($context))."
          ) + $detail
          ($md -join "`n") + "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Se sube siempre: el informe interesante es el de una ejecución en rojo.
      - name: Publicar los resultados
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-unitarias
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 14

  # Lo que solo falla al PUBLICAR (AUD-058). Hasta aquí, los tres fallos de publicación que documenta
  # CONTEXT.md §4 se descubrían el día del corte: el .pri de la app que `dotnet publish` no copia (lo arregla
  # el target CopyAppPriToPublish del .csproj), una ruta que pasa de MAX_PATH y que Inno Setup no sabe
  # comprimir, y un script sin BOM que PowerShell 5.1 lee con la página ANSI.
  #
  # Job aparte, en paralelo con el de arriba: no comparte nada con él y así no alarga su tiempo.
  publish-and-scripts:
    name: Publicación self-contained + scripts en PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar el SDK de .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Los mismos argumentos que build-installer.ps1, y a una carpeta fuera del repo como él.
      - name: Publicar como el instalador (self-contained)
        id: publish
        shell: pwsh
        run: >-
          dotnet publish src/FormatDiskPro/FormatDiskPro.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false
          -o "$env:RUNNER_TEMP\FormatDiskPro-publish"

      # La ruta se mide contra la que tendrá en la máquina de quien compile el instalador
      # (%TEMP%\FormatDiskPro-publish, con un nombre de usuario de 20 caracteres), no contra la del runner:
      # la del runner es más corta y daría por buena una ruta que allí no cabe.
      - name: Comprobar lo publicado (.pri y MAX_PATH)
        id: published
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          $dir    = Join-Path $env:RUNNER_TEMP 'FormatDiskPro-publish'
          $errors = @()

          foreach ($name in 'FormatDiskPro.exe', 'FormatDiskPro.pri') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $name))) {
              $errors += "Falta $name en la publicación. Sin el .pri, la app instalada se cierra al arrancar: ¿se ha roto el target CopyAppPriToPublish del .csproj?"
            }
          }

          $base    = 'C:\Users\' + ('u' * 20) + '\AppData\Local\Temp\FormatDiskPro-publish\'
          $limit   = 259   # MAX_PATH (260) menos el carácter nulo final
          $longest = Get-ChildItem -LiteralPath $dir -Recurse -File |
                     ForEach-Object { $_.FullName.Substring($dir.Length + 1) } |
                     Sort-Object Length -Descending | Select-Object -First 1
          $length  = $base.Length + $longest.Length
          if ($length -gt $limit) {
            $errors += "La ruta más larga de la publicación ocuparía $length caracteres (límite $limit), e Inno Setup no puede comprimirla: $longest"
          }

          $md = @(
            '## Publicación self-contained'
            ''
            '| Comprobación | Resultado |'
            '|---|---|'
            "| ``FormatDiskPro.pri`` en la publicación | $(if (Test-Path -LiteralPath (Join-Path $dir 'FormatDiskPro.pri')) { '✅' } else { '❌' }) |"
            "| Ruta más larga, con la base de ``build-installer.ps1`` | $(if ($length -gt $limit) { '❌' } else { '✅' }) $length de $limit caracteres: ``$longest`` |"
            ''
          )
          ($md -join "`n") + "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($errors) {
            $errors | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      # `powershell` (5.1) y no `pwsh`, a propósito: es el que ejecuta los scripts de verdad, y el que los
      # lee con la página ANSI si no llevan BOM. Por eso este paso no lleva ni un acento: su propio texto
      # lo lee también el 5.1. Se lee cada script con Get-Content, igual que al ejecutarlo, para que el
      # análisis vea lo mismo que verá el intérprete.
      # docs/ se excluye: son scripts de evidencia de la auditoría, no se ejecutan en ningún flujo.
      - name: Scripts .ps1 (BOM y analisis en PowerShell 5.1)
        id: scripts
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(git ls-files '*.ps1' | Where-Object { $_ -notlike 'docs/*' })
          if ($scripts.Count -eq 0) { Write-Output '::error::No se encontro ningun .ps1 que comprobar.'; exit 1 }

          $failed = 0
          $rows   = @()
          foreach ($path in $scripts) {
            $bytes    = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $path))
            $hasBom   = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $nonAscii = @($bytes | Where-Object { $_ -gt 0x7F }).Count -gt 0
            $problems = @()

            if ($nonAscii -and -not $hasBom) {
              $problems += 'tiene caracteres no ASCII y no lleva BOM UTF-8: PowerShell 5.1 lo leeria con la pagina ANSI (CONTEXT.md, Trampas de PowerShell 5.1)'
            }

            $text = Get-Content -LiteralPath $path -Raw
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, $path, [ref]$tokens, [ref]$parseErrors)
            foreach ($e in @($parseErrors)) {
              $problems += "no se analiza en PowerShell 5.1, linea $($e.Extent.StartLineNumber): $($e.Message)"
            }

            foreach ($p in $problems) { Write-Output ("::error file={0}::{0} {1}" -f $path, $p) }
            if ($problems.Count -gt 0) { $failed++ }
            $bom = if ($hasBom) { 'si' } elseif ($nonAscii) { 'NO' } else { 'no (solo ASCII)' }
            $ok  = if ($problems.Count -eq 0) { 'OK' } else { 'FALLA' }
            $rows += "| ``$path`` | $bom | $ok |"
          }

          $md = @('## Scripts .ps1 en PowerShell 5.1', '', '| Script | BOM | Resultado |', '|---|---|---|') + $rows + ''
          # AppendAllText sin codificacion escribe UTF-8 SIN BOM: Out-File -Encoding utf8 del 5.1 meteria
          # un BOM en mitad del resumen.
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($md -join "`n") + "`n")

          if ($failed -gt 0) { exit 1 }
