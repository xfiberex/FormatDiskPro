# CodeQL: análisis estático de seguridad del código de la app (C#).
#
# Existe desde el 2026-09-18, con el repositorio ya público. La app corre SIEMPRE elevada y lanza procesos
# (PowerShell, format.com, chkdsk.exe). La inyección de comandos está revisada a mano y bajo prueba (ROADMAP.md
# → *Áreas auditadas sin hallazgos*); esto es una segunda mirada, automática, en cada cambio.
#
# Quién ve qué, porque importa con la divulgación privada que pide SECURITY.md: la lista de alertas (pestaña
# Security) exige permiso de ESCRITURA en el repositorio. En un PR, las anotaciones las ve cualquiera, pero
# hablan del código que ese PR añade.
#
# Solo se analiza la APP (src/), no las pruebas: se compila su .csproj y no la solución.
# `manual` y no `none`: sin compilar no existe el código que genera el XAML (InitializeComponent, los campos
# de cada x:Name), y medio code-behind quedaría con referencias sin resolver.
#
# No activar a la vez el «default setup» de code scanning en los ajustes del repositorio: son excluyentes, y
# este es el que queda versionado junto al código.

name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  # Semanal aunque el código no cambie: las consultas de CodeQL sí cambian.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Análisis de seguridad (C#)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar el SDK de .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: csharp
          build-mode: manual

      # UseSharedCompilation=false: CodeQL tiene que ver cada llamada al compilador, y el servidor de
      # compilación de Roslyn las oculta.
      - name: Compilar la app
        shell: pwsh
        run: dotnet build src/FormatDiskPro/FormatDiskPro.csproj -c Release -p:UseSharedCompilation=false

      - name: Analizar
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:csharp
