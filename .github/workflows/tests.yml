# CI de SOLO pruebas unitarias.
#
# Por qué solo unitarias (y por qué eso no reabre nada): la decisión del 2026-07-12 descartó CI porque un
# runner hospedado NO puede ejecutar los UI tests — necesitan sesión elevada y la USB física de pruebas—.
# Sigue siendo cierto, y aquí no se intenta. Pero ese argumento dejaba también los unitarios sin ejecutarse
# en ningún PR: hasta ahora solo corrían en la máquina del mantenedor, durante `release.ps1`. Esto cubre ese
# hueco y nada más.
#
# `dotnet test` sobre FormatDiskPro.slnx NO arrastra los UI tests: el proyecto tests/FormatDiskPro.UiTests
# está fuera de la solución a propósito, precisamente para esto.
#
# Windows y no ubuntu: la app es WinUI 3 (net10.0-windows10.0.19041.0) y las pruebas cubren código que
# depende de Windows.

name: Pruebas unitarias

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Build + unitarias
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar el SDK de .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore FormatDiskPro.slnx

      # -warnaserror porque el proyecto compila a 0 advertencias y esa disciplina es parte de lo que se
      # protege aquí. Se excluyen los códigos NU19xx (avisos de vulnerabilidades de NuGet): son útiles, pero
      # aparecen y desaparecen por publicaciones de terceros y tumbarían PRs que no tienen nada que ver.
      - name: Compilar (Release, sin advertencias)
        run: dotnet build FormatDiskPro.slnx -c Release --no-restore -warnaserror -nowarn:NU1901,NU1902,NU1903,NU1904

      - name: Pruebas unitarias
        run: dotnet test FormatDiskPro.slnx -c Release --no-build --nologo --logger "trx;LogFileName=unitarias.trx" --results-directory artifacts/tests

      # Se sube siempre: cuando el interesante es el informe de una corrida en rojo.
      - name: Publicar los resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-unitarias
          path: artifacts/tests
          if-no-files-found: warn
